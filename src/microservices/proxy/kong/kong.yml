_format_version: "3.0"

services:
  - name: monolith
    url: ${K_MONOLITH_URL}
    routes:
    - name: monolith-route
      paths:
        - "/"

  - name: events-service
    url: ${K_EVENTS_SERVICE_URL}
    routes:
      - name: events-route
        paths:
          - "/api/events"

  - name: movies-service
    host: movies-upstream
    protocol: http
    port: 8000
    enabled: ${K_GRADUAL_MIGRATION}
    routes:
    - name: movies-route
      strip_path: false
      paths:
        - "/api/movies"

upstreams:
  - name: movies-upstream
    targets:
    - target: ${K_MOVIES_SERVICE_HOST}
      weight: ${K_MOVIES_MIGRATION_PERCENT}
    - target: ${K_MONOLITH_HOST}
      weight: MONOLITH_PERCENT
