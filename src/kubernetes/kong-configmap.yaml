apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-configuration
  namespace: cinemaabyss
data:
  kong.yml: |
    _format_version: "3.0"
    
    services:
      - name: monolith
        url: http://monolith:8080
        routes:
        - name: monolith-route
          paths:
            - "/"
            
      - name: events-service
        url: http://events-service:8082
        routes:
        - name: events-route
          paths:
            - "/api/events"
              
      - name: movies-service
        host: movies-upstream
        protocol: http
        port: 8000
        enabled: true
        routes:
        - name: movies-route
          strip_path: false
          paths:
            - "/api/movies"
            
    upstreams:
      - name: movies-upstream
        targets:
        - target: host.docker.internal:8081
          weight: 50
        - target: host.docker.internal:8080
          weight: 50
