apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-configuration
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  kong.yml: |
    _format_version: "3.0"

    services:
    - name: monolith
      url: {{ .Values.config.proxyService.monolithUrl }}
      routes:
      - name: monolith-route
        paths:
          - "/"

    - name: movies-service
      host: movies-upstream
      enabled: {{ .Values.config.proxyService.gradualMigration }}
      routes:
      - name: movies-route
        strip_path: false
        paths:
          - "/api/movies"

    upstreams:
      - name: movies-upstream
        targets:
        - target: {{ .Values.config.proxyService.moviesHost }}
          weight: {{ .Values.config.proxyService.moviesServiceMigrationPercent }}
        - target: {{ .Values.config.proxyService.monolithHost }}
          weight: {{ .Values.config.proxyService.monolithMovieMigrationPercent }}
